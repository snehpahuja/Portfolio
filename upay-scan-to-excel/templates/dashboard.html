<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPAY | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Style to ensure iframe takes full height */
      .iframe-container {
        height: calc(
          100vh - 64px
        ); /* Full viewport height minus header height */
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <div class="w-64 bg-white shadow-md">
        <div class="p-6">
          <div class="flex items-center">
            <svg
              class="h-8 w-auto text-indigo-600"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 18.375a6.375 6.375 0 006.375-6.375V9.75A6.375 6.375 0 0012 3.375zM12 18.375A6.375 6.375 0 015.625 12V9.75a6.375 6.375 0 016.375-6.375zM12 18.375v-6.375"
              />
            </svg>
            <h1 class="ml-3 text-xl font-bold text-gray-800">UPAY</h1>
          </div>
        </div>
        <nav class="mt-6">
          <a
            href="home.html"
            class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-100"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span class="ml-3">Home</span>
          </a>
          <a
            href="upload.html"
            class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-100"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              />
            </svg>
            <span class="ml-3">Upload</span>
          </a>
          <a
            href="dashboard.html"
            class="flex items-center px-6 py-3 bg-gray-200 text-gray-800 font-semibold"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            <span class="ml-3">Dashboard</span>
          </a>
          <a
            href="profile.html"
            class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-100"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span class="ml-3">Profile</span>
          </a>
        </nav>
        <div class="absolute bottom-0 w-64">
          <a
            href="index.html"
            class="flex items-center px-6 py-4 text-gray-600 hover:bg-gray-100"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
            <span class="ml-3">Logout</span>
          </a>
        </div>
      </div>
      <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 h-16">
          <h2 class="text-2xl font-semibold text-gray-800">
            Analytics Dashboard
          </h2>
        </header>
        <main class="flex-1 bg-gray-100">
          <div class="iframe-container w-full h-full">
            <iframe
              src="http://localhost:8501"
              class="w-full h-full border-none"
              title="Streamlit Analytics Dashboard"
            >
            </iframe>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
